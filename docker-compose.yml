services:
  gravy-boat:
    image: ghcr.io/majawat/gravy-boat:latest
    # build: .                      # or build from this checkout instead
    container_name: gravy-boat
    restart: unless-stopped
    ports:
      - "8794:8794"
    env_file: .env
    volumes:
      - ./data:/data
    # environment:
    #   PUID: "1000"                # owner of ./data and the app's user (Unraid: 99 / 100)
    #   PGID: "1000"
